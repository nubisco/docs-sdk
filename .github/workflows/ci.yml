name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, types, format and the fixture site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test
      - run: pnpm run types:check
      - run: pnpm run format:check
      # Builds the SDK, then a whole site with it. If a change breaks a
      # consumer, it breaks here first.
      - run: pnpm run docs:build
